# OoT Deeper Water: which water surfaces get a more opaque primitive alpha, and how much.
#
# Mapping: proportional. Every patched water material's opacity a becomes a * max_alpha / a_max:
# every surface gets more opaque, the ratios between surfaces (the water's dynamic range) stay,
# and water as opaque as a_max lands on max_alpha. Nothing goes above max_alpha; water already at
# or above it keeps its value; nothing is ever made less opaque. A surface's own max_alpha
# (gameplay: seeing Link, items, enemies and the floor below) caps it further.
#
# max_alpha 0.70: a translucent surface of opacity a shows a submerged object of contrast C
# against the floor with contrast (1 - a) * C. Link, items and enemies against the floor have
# C ~ 0.4-0.5 (OKLab L); at 0.70 that is 0.12-0.15 on screen, clearly above the +-0.1 flicker of
# the scrolling caustics (at 0.80 it drops under it). The game's own most opaque non-diving water
# sits at 0.70-0.80 (Zora's Domain falls, Forest Temple wells, Ice Cavern puddles).
max_alpha = 0.70
mapping = "proportional"
# The opacity that maps to max_alpha. Most of the game's water sits at 0.39-0.50 (the Kokiri pond
# 0.39, Hyrule Field and Zora's River 0.40, the Deku Tree, Zora's Fountain and the grottos 0.50):
# a_max 0.50 lifts them by 1.4x with their ratios kept (pond 0.39 -> 0.55). The few waters
# between 0.50 and 0.70 (castle moats 0.60, Lake Hylia's second layer 0.63, the oasis 0.65) reach
# max_alpha. Unset, a_max is the most opaque patched water below max_alpha, which is 0.70 itself
# (Zora's Domain falls): the scale would be 1.0 and nothing would change.
a_max = 0.50

